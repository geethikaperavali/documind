<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – DocuMind</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <div class="brand-icon">D</div>
          <span>DocuMind</span>
        </a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a password reset link</p>
      </div>

      <div id="auth-alert" class="alert alert-error"></div>
      <div id="auth-success" class="alert alert-success"></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Account email address</label>
          <div class="form-input-wrap">
            <input type="email" id="email" class="form-input" placeholder="name@company.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="/login.html" class="auth-link">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("forgot-form");
      const btnSubmit = document.getElementById("btn-submit");
      const alertEl = document.getElementById("auth-alert");
      const successEl = document.getElementById("auth-success");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.classList.remove("show");
        successEl.classList.remove("show");

        const email = document.getElementById("email").value.trim();
        if (!email) {
          alertEl.textContent = "Please enter your email address.";
          alertEl.classList.add("show");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Sending reset link...";

        try {
          await window.authManager.resetPasswordForEmail(email);
          successEl.textContent = "Password reset link sent! Check your inbox for instructions.";
          successEl.classList.add("show");
          form.reset();
        } catch (err) {
          alertEl.textContent = err.message;
          alertEl.classList.add("show");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Send Reset Link";
        }
      });
    });
  </script>
</body>
</html>
