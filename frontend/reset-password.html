<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – DocuMind</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <div class="brand-icon">D</div>
          <span>DocuMind</span>
        </a>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Create a secure new password for your account</p>
      </div>

      <div id="auth-alert" class="alert alert-error"></div>
      <div id="auth-success" class="alert alert-success"></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <div class="form-input-wrap">
            <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm new password</label>
          <div class="form-input-wrap">
            <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
          Update Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login.html" class="auth-link">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("reset-form");
      const btnSubmit = document.getElementById("btn-submit");
      const alertEl = document.getElementById("auth-alert");
      const successEl = document.getElementById("auth-success");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.classList.remove("show");
        successEl.classList.remove("show");

        const password = document.getElementById("password").value;
        const confirmPw = document.getElementById("confirm-password").value;

        if (!password || !confirmPw) {
          alertEl.textContent = "Please fill in all fields.";
          alertEl.classList.add("show");
          return;
        }

        if (password.length < 6) {
          alertEl.textContent = "Password must be at least 6 characters long.";
          alertEl.classList.add("show");
          return;
        }

        if (password !== confirmPw) {
          alertEl.textContent = "Passwords do not match.";
          alertEl.classList.add("show");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Updating...";

        try {
          await window.authManager.updatePassword(password);
          successEl.textContent = "Password updated successfully! Redirecting to Sign In...";
          successEl.classList.add("show");
          setTimeout(() => {
            window.location.href = window.CONFIG.ROUTES.LOGIN;
          }, 2000);
        } catch (err) {
          alertEl.textContent = err.message;
          alertEl.classList.add("show");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Update Password";
        }
      });
    });
  </script>
</body>
</html>
