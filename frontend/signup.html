<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – DocuMind</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <div class="brand-icon">D</div>
          <span>DocuMind</span>
        </a>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start turning documents into actionable intelligence</p>
      </div>

      <div id="auth-alert" class="alert alert-error"></div>
      <div id="auth-success" class="alert alert-success"></div>

      <!-- Google OAuth Button -->
      <button type="button" id="btn-google-signup" class="btn-google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>or register with email</span>
      </div>

      <!-- Registration Form -->
      <form id="signup-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="full-name">Full name</label>
          <div class="form-input-wrap">
            <input type="text" id="full-name" class="form-input" placeholder="Sarah Connor" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="form-input-wrap">
            <input type="email" id="email" class="form-input" placeholder="name@company.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-input-wrap">
            <input type="password" id="password" class="form-input input-has-btn" placeholder="Minimum 6 characters" required autocomplete="new-password">
            <button type="button" class="btn-toggle-pw" id="btn-toggle-pw" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <div class="form-input-wrap">
            <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html" class="auth-link">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await window.authManager.redirectIfAuthenticated();

      const form = document.getElementById("signup-form");
      const btnSubmit = document.getElementById("btn-submit");
      const btnGoogle = document.getElementById("btn-google-signup");
      const alertEl = document.getElementById("auth-alert");
      const successEl = document.getElementById("auth-success");
      const pwInput = document.getElementById("password");
      const confirmPwInput = document.getElementById("confirm-password");
      const togglePwBtn = document.getElementById("btn-toggle-pw");

      // Password toggle
      togglePwBtn.addEventListener("click", () => {
        const isPw = pwInput.type === "password";
        pwInput.type = isPw ? "text" : "password";
      });

      // Form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.classList.remove("show");
        successEl.classList.remove("show");

        const fullName = document.getElementById("full-name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = pwInput.value;
        const confirmPw = confirmPwInput.value;

        if (!fullName || !email || !password || !confirmPw) {
          showAlert("Please fill in all fields.");
          return;
        }

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters long.");
          return;
        }

        if (password !== confirmPw) {
          showAlert("Passwords do not match. Please re-enter.");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Creating account...";

        try {
          const data = await window.authManager.signUpWithEmail(email, password, fullName);
          
          if (data.session) {
            // Direct sign-in if email confirmation is disabled
            window.location.href = window.CONFIG.ROUTES.DASHBOARD;
          } else {
            // Email confirmation required
            successEl.textContent = "Account created! Please check your email to confirm your account before signing in.";
            successEl.classList.add("show");
            form.reset();
          }
        } catch (err) {
          showAlert(err.message);
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Create Account";
        }
      });

      // Google OAuth Sign Up
      btnGoogle.addEventListener("click", async () => {
        alertEl.classList.remove("show");
        btnGoogle.disabled = true;
        try {
          await window.authManager.signInWithGoogle();
        } catch (err) {
          showAlert("Google sign-in error: " + err.message);
          btnGoogle.disabled = false;
        }
      });

      function showAlert(msg) {
        alertEl.textContent = msg;
        alertEl.classList.add("show");
      }
    });
  </script>
</body>
</html>
